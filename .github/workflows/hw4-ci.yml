name: "HW4 CI"

on:
  push:
    branches: [ '**' ]
    paths:
      - 'hw2/hw/**'
      - 'hw4/check_persistence.sh'
      - 'docker-compose.yml'
      - '.github/workflows/hw4-ci.yml'
  pull_request:
    paths:
      - 'hw2/hw/**'
      - 'hw4/check_persistence.sh'
      - 'docker-compose.yml'
      - '.github/workflows/hw4-ci.yml'

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hw2/hw/requirements.txt

      - name: Run tests on temporary SQLite
        working-directory: hw2/hw
        env:
          PYTHONPATH: ${{ github.workspace }}/hw2/hw
        run: pytest test_homework2.py test_shop_extra.py test_metrics.py -v

  postgres-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U shop -d shop_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hw2/hw/requirements.txt

      - name: Run PostgreSQL tests
        working-directory: hw2/hw
        env:
          PYTHONPATH: ${{ github.workspace }}/hw2/hw
          TEST_POSTGRES_URL: postgresql+psycopg://shop:shop@localhost:5432/shop_test
        run: pytest test_postgres.py -v

  compose-persistence:
    runs-on: ubuntu-latest
    needs: [sqlite-tests, postgres-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check data survives down/up and restart
        run: ./hw4/check_persistence.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
