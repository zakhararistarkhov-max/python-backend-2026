name: "HW3 CI"

on:
  push:
    branches: [ '**' ]
    paths:
      - 'hw2/hw/**'
      - 'hw3/**'
      - 'monitoring/**'
      - 'docker-compose.yml'
      - '.github/workflows/hw3-ci.yml'
  pull_request:
    paths:
      - 'hw2/hw/**'
      - 'hw3/**'
      - 'monitoring/**'
      - 'docker-compose.yml'
      - '.github/workflows/hw3-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hw2/hw/requirements.txt

      - name: Run tests
        working-directory: hw2/hw
        env:
          PYTHONPATH: ${{ github.workspace }}/hw2/hw
        run: pytest test_homework2.py test_shop_extra.py test_metrics.py -v

  compose:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate dashboards JSON
        run: |
          for f in monitoring/grafana/dashboards/*.json; do
            python -m json.tool "$f" > /dev/null && echo "ok $f"
          done

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for shop health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q shop)")
            echo "shop: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker compose logs shop
          exit 1

      - name: Run load generator
        run: |
          pip install httpx
          python hw3/load_generator.py --duration 20 --rps 20 --concurrency 4 --seed 1

      - name: Check Prometheus target and custom metrics
        run: |
          query() {
            curl -sf --get http://localhost:9090/api/v1/query --data-urlencode "query=$1"
          }
          for i in $(seq 1 20); do
            up=$(query 'up{job="shop", datacenter="local"}' | python -c 'import json,sys; r=json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else "")')
            items=$(query 'sum(shop_items_created_total{job="shop"})' | python -c 'import json,sys; r=json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else "0")')
            echo "up=$up items_created=$items"
            if [ "$up" = "1" ] && python -c "import sys; sys.exit(float('$items') <= 0)"; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Check Grafana provisioning
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/dashboards/uid/shop-service > /dev/null
          curl -sf http://localhost:3000/api/dashboards/uid/shop-resources > /dev/null

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
