name: "HW5 Coverage"

on:
  push:
    paths:
      - 'hw2/hw/**'
      - 'hw5/**'
      - 'lecture5/hw/**'
      - '.github/workflows/hw5-ci.yml'
  pull_request:
    paths:
      - 'hw2/hw/**'
      - 'hw5/**'
      - 'lecture5/hw/**'
      - '.github/workflows/hw5-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    defaults:
      run:
        working-directory: hw2/hw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: hw2/hw/requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test with at least 95% coverage (including branches)
        run: >-
          python -m pytest --cov --cov-config=.coveragerc
          --cov-report=term-missing --cov-report=xml --cov-report=html -v
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sqlite-py${{ matrix.python-version }}
          path: |
            hw2/hw/coverage.xml
            hw2/hw/htmlcov/
          if-no-files-found: warn

  postgres:
    name: PostgreSQL / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U shop -d shop_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: hw2/hw
    env:
      DATABASE_URL: postgresql+psycopg://shop:shop@localhost:5432/shop_test
      TEST_POSTGRES_URL: postgresql+psycopg://shop:shop@localhost:5432/shop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: hw2/hw/requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test with PostgreSQL and at least 95% coverage
        run: >-
          python -m pytest --cov --cov-config=.coveragerc
          --cov-report=term-missing --cov-report=xml --cov-report=html -v
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-postgres-py${{ matrix.python-version }}
          path: |
            hw2/hw/coverage.xml
            hw2/hw/htmlcov/
          if-no-files-found: warn
